<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <style>
        /*As CSS sempre prevalecem sobre o HTML*/
        iframe {
            width: 400px;
            height: 400px;
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um Iframe</h1>
    <p>Acessando o site do 
        
        <!--Tamanho padrão: 300x150-->

        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scrolling="auto">
            <a href="https://www.cursoemvideo.com">Curso em Vídeo</a>
        </iframe>

        para aprender a programar</p>
    <p>
        O site do <iframe src="https://www.google.com" frameborder="0"></iframe>também é muito legal, pena que não funciona dentro do iframe
    </p>

    <p>
        O repositório do <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">guanabara</iframe> também é bem legal
    </p>
</body>
</html>
